<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Play</title>
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* The game owns the whole screen; the page around it is only a way back. */
    html, body { height: 100%; }
    body.phone { background: #000; color: #e7eaee; overflow: hidden; overscroll-behavior: none; }
    .phone .back {
      position: fixed; top: calc(env(safe-area-inset-top) + 0.5rem); left: 0.5rem; z-index: 5;
      min-height: var(--tap); padding: 0 0.9rem; border-radius: var(--r-3);
      display: inline-flex; align-items: center;
      background: rgba(0, 0, 0, 0.45); color: inherit; text-decoration: none;
    }
    .phone #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .phone .said { position: fixed; inset: 0; display: grid; place-items: center; padding: 1.5rem; text-align: center; }
    .phone .said p { max-width: 28rem; }
  </style>
</head>
<body class="phone">
  <a class="back" href="/">Shelf</a>
  <div id="game"></div>
  <div class="said" id="said"><p id="words">Looking…</p></div>
  <script src="/phone.js"></script>
</body>
</html>
