<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play</title>
  <meta name="description" content="The shelf, from the sofa." />
  <meta name="theme-color" content="#e8eaed" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1e21" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Play" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="chrome">
  <header class="top">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M 5 7 H 19 A 2 2 0 0 1 21 9 V 16 A 2 2 0 0 1 19 18 H 5 A 2 2 0 0 1 3 16 V 9 A 2 2 0 0 1 5 7 Z"/>
        <path d="M 9.5 7 V 4"/>
        <path d="M 14.5 7 V 4"/>
        <path d="M 10.4 10.4 L 14.6 12.5 L 10.4 14.6 Z" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="brand">Play</span>
  </header>

  <div class="playing" id="playing" role="status" aria-live="polite" hidden></div>
  <p class="trouble" id="trouble" role="status" aria-live="polite" hidden></p>
  </div>

  <main class="page">
    <input class="search" id="search" type="search" placeholder="Filter the shelf"
      aria-label="Filter the shelf" autocomplete="off" autocapitalize="off"
      autocorrect="off" spellcheck="false" enterkeyhint="search" />
    <div class="chips" id="chips" role="group" aria-label="Systems"></div>
    <p class="quiet note" id="note" hidden></p>
    <div id="shelves"></div>
  </main>

  <dialog class="sheet" id="sheet" aria-label="Game">
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
