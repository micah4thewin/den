<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231b1d20' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M 5 7 H 19 A 2 2 0 0 1 21 9 V 16 A 2 2 0 0 1 19 18 H 5 A 2 2 0 0 1 3 16 V 9 A 2 2 0 0 1 5 7 Z'/%3E%3Cpath d='M 9.5 7 V 4'/%3E%3Cpath d='M 14.5 7 V 4'/%3E%3Cpath d='M 10.4 10.4 L 14.6 12.5 L 10.4 14.6 Z' fill='%231b1d20' stroke='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M 5 7 H 19 A 2 2 0 0 1 21 9 V 16 A 2 2 0 0 1 19 18 H 5 A 2 2 0 0 1 3 16 V 9 A 2 2 0 0 1 5 7 Z"/>
        <path d="M 9.5 7 V 4"/>
        <path d="M 14.5 7 V 4"/>
        <path d="M 10.4 10.4 L 14.6 12.5 L 10.4 14.6 Z" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="brand">Play</span>
    <span class="spacer"></span>
    <span class="quiet" id="status" role="status" aria-live="polite"></span>
  </header>

  <main class="page">
    <input class="search" id="search" type="search" placeholder="Filter the shelf"
      aria-label="Filter the shelf" autocomplete="off" />
    <p class="quiet" id="note" hidden></p>
    <div id="shelves"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
