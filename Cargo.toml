[workspace]
resolver = "2"
members = [
  "crates/play-ident",
  "crates/play-intake",
  "crates/play-db",
  "crates/play-runner",
  "crates/play-input",
  "crates/play-core",
  "crates/play-web",
  "crates/play-doctor",
  "crates/play-art",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
dirs = "5"

sha1 = "0.10"
crc32fast = "1"

zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd", "aes-crypto"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate", "zstd", "brotli", "lz4", "util"] }
unrar = "0.5"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rs = "0.3"
zstd = "0.13"

rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "symbols"
