[workspace]
resolver = "2"
members = [
  "crates/den-ident",
  "crates/den-intake",
  "crates/den-db",
  "crates/den-runner",
  "crates/den-input",
  "crates/den-core",
  "crates/den-web",
  "crates/den-doctor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
dirs = "5"

sha1 = "0.10"
crc32fast = "1"

zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
sevenz-rust = { version = "0.6", default-features = false }
tar = "0.4"
flate2 = "1"

rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "symbols"
