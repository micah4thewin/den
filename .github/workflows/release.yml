name: Release

# Builds the installers, each with everything it needs inside it:
#
#   Debian / Ubuntu x86-64   .deb and .AppImage, RetroArch and its cores bundled
#   Windows 10/11 x86-64     .exe (NSIS) and .msi, RetroArch and its cores bundled
#   Raspberry Pi (arm64)     .deb that pulls in Debian's `retroarch` through apt
#
# then installs the x86-64 .deb on a clean Debian and the Windows installer on
# a clean runner, and checks the bundled RetroArch starts.
#
# Run it from the Actions tab, or push a tag like v0.2.0.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian x86-64
            os: ubuntu-22.04
            bundles: deb,appimage
            runtime: true
            config: "{}"
          - name: Raspberry Pi arm64
            os: ubuntu-22.04-arm
            bundles: deb
            runtime: false
            config: '{"bundle":{"linux":{"deb":{"depends":["retroarch"]}}}}'
          - name: Windows x86-64
            os: windows-latest
            bundles: nsis,msi
            runtime: true
            config: "{}"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf file libfuse2 p7zip-full

      # Pins on first use: a download the manifest has no hash for is recorded
      # and the hash printed below, to be committed so later builds verify.
      - name: Stage RetroArch and its cores
        if: matrix.runtime
        run: |
          python3 tools/bundle_runtime.py --from-manifest --record
          python3 tools/bundle_runtime.py --check
          ls -la apps/desktop/src-tauri/resources/runtime apps/desktop/src-tauri/resources/runtime/cores
      - name: Pinned hashes
        if: matrix.runtime
        run: |
          {
            echo "### Runtime pins for ${{ matrix.name }}"
            echo '```json'
            cat tools/runtime-manifest.json
            echo '```'
            if ! git diff --quiet tools/runtime-manifest.json; then
              echo "New hashes were recorded. Commit this manifest so the next build verifies them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Installers
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }} --config '${{ matrix.config }}'

      - uses: actions/upload-artifact@v4
        with:
          name: play-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            tools/runtime-manifest.json
          if-no-files-found: error

  debian:
    name: Installs on a clean Debian
    needs: build
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: play-Linux-X64
      - name: Install the .deb with apt, as a person would
        run: |
          apt-get update
          apt-get install -y ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
      - name: The bundled RetroArch and cores are there and run
        run: |
          set -e
          ls -la /usr/lib/Play/runtime /usr/lib/Play/runtime/cores
          test -x /usr/lib/Play/runtime/retroarch
          ls /usr/lib/Play/runtime/cores/*_libretro.so
          APPIMAGE_EXTRACT_AND_RUN=1 /usr/lib/Play/runtime/retroarch --version

  windows:
    name: Installs on a clean Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: play-Windows-X64
      - name: Install silently, as the installer would for a person
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Recurse -Filter *-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
      - name: The bundled RetroArch and cores are there and run
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'Play\runtime'
          Get-ChildItem $root
          if (-not (Test-Path (Join-Path $root 'retroarch.exe'))) { throw 'no retroarch.exe' }
          if (-not (Get-ChildItem (Join-Path $root 'cores') -Filter *_libretro.dll)) { throw 'no cores' }
          & (Join-Path $root 'retroarch.exe') --version
