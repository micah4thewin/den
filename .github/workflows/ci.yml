name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Core workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: The diagnostic runs
        run: cargo run -q -p play-doctor -- "$RUNNER_TEMP/play-ci-library"

  # The intake, the archive readers compiled into it (RAR and zstd are C and
  # C++ built by cargo), and the cover matcher, on the other machines Play
  # ships for. The messy-drop tests are the ones that matter here.
  platforms:
    name: Intake on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Raspberry Pi (arm64), os: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The workspace builds
        run: cargo build --workspace --all-targets
      - name: Intake, archives and covers
        run: cargo test -p play-ident -p play-intake -p play-art
      - name: The diagnostic runs
        run: cargo run -q -p play-doctor -- "$RUNNER_TEMP/play-ci-library"

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Types and bundle
        run: npm run build

  shell:
    name: Desktop shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/desktop
      - name: Formatting
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - name: Build
        run: cargo check --all-targets
        working-directory: apps/desktop/src-tauri

  runtime:
    name: Runtime bundling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_bundle_runtime.py
      - name: The manifest is valid JSON with the keys the script reads
        run: |
          python3 - <<'EOF'
          import json
          m = json.load(open("tools/runtime-manifest.json"))
          platforms = m["platforms"]
          assert platforms, "no platforms in the manifest"
          for key, entry in platforms.items():
              assert set(entry) <= {"url", "sha256", "cores"}, f"{key}: unexpected keys {set(entry)}"
              assert {"url", "sha256"} <= set(entry), f"{key}: missing url or sha256"
              if "cores" in entry:
                  assert set(entry["cores"]) == {"url", "sha256"}, f"{key}: bad cores entry"
          print(f"{len(platforms)} platforms")
          EOF

  brand:
    name: Brand mark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_brand.py

  covers:
    name: Box art index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every system has names
        run: python3 tools/cover_index.py --check
