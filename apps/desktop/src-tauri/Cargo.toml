[package]
name = "play-desktop"
description = "The Play desktop shell"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
name = "play_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
play-core = { path = "../../../crates/play-core" }
play-web = { path = "../../../crates/play-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
